<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SubAdmin Login In | Aman Technologies</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #6f74dd,rgb(90, 29, 204));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            color: #6f74dd;
            text-align: center;
            margin-bottom: 10px;
        }

        .brand1 {
            font-size: 28px;
            font-weight: 700;
            color: #6f74dd;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-primary {
            background: #6f74dd;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #5c60c9;
        }

        .extra-links a {
            color: #6f74dd;
            text-decoration: none;
            font-weight: 500;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .error-text {
            color: #dc3545;
            font-size: 14px;
        }
    </style>
</head>
<body>


<div class="login-card">

    <div class="brand1">Aman Technologies</div>

    <div class="brand">🔒 SubAdmin Login</div>
 

    <form method="post" action="{% url 'subadminlogin' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="Subadminemail" class="form-control" placeholder="Enter Email" required>
        </div>

        {% comment %} <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" placeholder="Enter your Department" required>
        </div> {% endcomment %}

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="Password" name="Subadminpassword" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">Sign In</button>
        </div>
    </form>

    <div class="extra-links text-center mt-4">
        <p class="mb-1">
            <a href="{% url 'forgotsubadmin' %}">Forgot password?</a>
        </p>

        <p>
            <a href="{% url 'subadmindashboard'%}">Back!</a>
        </p>
    </div>
</div>

</body>
</html>
