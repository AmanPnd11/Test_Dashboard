{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SubAdmin Change Password| Aman Technologies</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
            /* Background Image */
            background: url("{% static 'images/tgp1.jpg' %}") no-repeat center center;
            background-size: cover;
            position: relative;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            color: #6f74dd;
            text-align: center;
            margin-bottom: 10px;
        }

        .brand1 {
            font-size: 28px;
            font-weight: 700;
            color: #6f74dd;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-primary {
            background: #6f74dd;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #5c60c9;
        }

        .extra-links a {
            color: #6f74dd;
            text-decoration: none;
            font-weight: 500;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .error-text {
            color: #dc3545;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class="brand1"> <img src="{% static 'images/tgpcete.jpg' %}" class="img-fluid hero-img"
        width="200">
    </div>

    <div class="brand">🔒 Change Password</div>
 

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Create New Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        {% if error %}
            <p class="error-text">{{ error }}</p>
        {% endif %}

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">Change Password</button>
        </div>
    </form>

     <!-- Django Messages -->
     {% for message in messages %}
     <div class="alert alert-info mt-3">
         {{ message }}
     </div>
     {% endfor %}

    <div class="extra-links text-center mt-4">

        <p>
            <a href="{% url 'subadmindashboard'%}">Back!</a>
        </p>
    </div>
</div>

</body>
</html>
