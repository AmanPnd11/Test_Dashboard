{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Change Password | Aman Technologies</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", sans-serif;
        /* Background Image */
        background: url("{% static 'images/tgp1.jpg' %}") no-repeat center center;
        background-size: cover;
        position: relative;
    }

    .login-card{
        background:#fff;
        border-radius:16px;
        padding:40px;
        width:100%;
        max-width:420px;
        box-shadow:0 20px 40px rgba(0,0,0,.15);
    }

    .brand1 {
        font-size: 28px;
        font-weight: 700;
        color: #6f74dd;
        text-align: center;
        margin-bottom: 10px;
    }
</style>
</head>

<body>

    <div class="login-card">
         
        <div class="brand1"> <img src="{% static 'images/tgpcete.jpg' %}" class="img-fluid hero-img"
            width="200"></div>
            
            <h3 class="text-center text-primary mb-4">🔒 Change Password</h3>
         
         <form method="POST">
             {% csrf_token %}
             
             <div class="mb-3">
                <label class="form-label">Admin Email</label>
                  <input type="email" name="Email" class="form-control" required>
             </div>
             
             <div class="mb-3">
               <label class="form-label">New Password</label>
                  <input type="password" name="new_password" class="form-control" required>
             </div>
             
             <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                  <input type="password" name="confirm_password" class="form-control" required>
             </div>
             
             <div class="d-grid">
               <button type="submit" class="btn btn-primary">
                  Change Password
               </button>
             </div>
         </form>
         
         <!-- Django Messages -->
         {% for message in messages %}
         <div class="alert alert-info mt-3">
             {{ message }}
         </div>
         {% endfor %}
         
         <div class="text-center mt-3">
             <a href="{% url 'adminlogin' %}">⬅ Back</a>
         </div>
         
        </div>
    </div>

</body>
</html>
