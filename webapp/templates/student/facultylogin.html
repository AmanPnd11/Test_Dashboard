{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faculty Portal | Aman Technologies</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:"Segoe UI",sans-serif;
margin:0;

background-image:url("{% static 'images/tgp_logo1.jpg' %}");
background-color:rgba(0,0,0,0.55);
background-size:cover;
background-position:center;
background-blend-mode:darken;
}

/* Back Button */

.back-btn{
position:absolute;
top:20px;
right:30px;
background:linear-gradient(45deg,#1e3c72,#2a5298);
color:white;
padding:10px 20px;
border-radius:50px;
text-decoration:none;
font-weight:600;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
transition:0.3s;
}

.back-btn:hover{
transform:translateY(-3px);
color:white;
box-shadow:0 15px 30px rgba(0,0,0,0.35);
}

/* Main Card */

.portal-card{
background:white;
border-radius:20px;
padding:45px 40px;
max-width:500px;
width:100%;
box-shadow:0 25px 60px rgba(0,0,0,0.3);
text-align:center;

animation:fadeUp 0.9s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.portal-title{
font-size:26px;
font-weight:700;
color:#1e3c72;
margin-bottom:10px;
}

.portal-subtitle{
color:#555;
margin-bottom:30px;
}

/* Login Buttons */

.portal-btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;

padding:14px;
border-radius:50px;
font-weight:600;
font-size:16px;

text-decoration:none;
color:white;

background:linear-gradient(45deg,#1e3c72,#2a5298);

transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.portal-btn:hover{
transform:translateY(-4px);
box-shadow:0 15px 35px rgba(0,0,0,0.35);
color:white;
}

/* Icon */

.portal-btn i{
font-size:20px;
}

/* Spacing */

.portal-btn + .portal-btn{
margin-top:18px;
}

/* Responsive */

@media(max-width:576px){

.portal-card{
padding:30px 20px;
}

.portal-title{
font-size:22px;
}

.back-btn{
top:10px;
right:10px;
padding:8px 16px;
font-size:14px;
}

}

</style>
</head>

<body>

<!-- Back Button -->

<a href="{% url 'studentlogin' %}" class="back-btn">
<i class="bi bi-arrow-left"></i> Back
</a>

<div class="portal-card">

<img src="{% static 'images/tgpcete.jpg' %}" width="180" class="mb-3">

<div class="portal-title">
🎓 Faculty Portal
</div>

<div class="portal-subtitle">
Select your login type
</div>

<!-- Admin Login -->

<a href="{% url 'adminlogin' %}" class="portal-btn">
<i class="bi bi-person-gear"></i>
Admin Login
</a>

<!-- Sub Admin Login -->

<a href="{% url 'subadminlogin' %}" class="portal-btn">
<i class="bi bi-person-workspace"></i>
Sub Admin Login
</a>

<!-- Faculty Login -->

<a href="{% url 'facultyloginform' %}" class="portal-btn">
<i class="bi bi-person-badge"></i>
Faculty Login
</a>

</div>

</body>
</html>
