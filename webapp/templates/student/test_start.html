{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ test.title }} | Online Test</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #0d9e8a;
            --primary-dark: #077a6a;
            --accent: #5c4ee8;
            --accent-light: #7b6ef6;
            --answered: #5c4ee8;
            --review: #e8a020;
            --unattempted: #e05c5c;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a2236;
            --muted: #6b7a99;
            --border: #e0e7ef;
            --header-h: 68px;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        
        header {
            height: var(--header-h);
            background: linear-gradient(135deg, #1a0e6b 0%, #0d9e8a 100%);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 2px; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 16px rgba(0,0,0,0.18);
        }
        header h1 { font-family: 'Sora', sans-serif; font-size: clamp(1rem, 2.5vw, 1.4rem); color: #fff; }
        header .subtitle { font-size: 0.85rem; color: rgba(255,255,255,0.85); font-weight: 500; }
        
        .timer-badge {
            position: absolute; right: 20px; background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 5px 14px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
        }
        .timer-badge .dot { width: 8px; height: 8px; background: #4fffb0; border-radius: 50%; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.7); } }

        .layout { display: flex; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; padding: 20px 16px; gap: 18px; align-items: flex-start; }
        .sidebar { width: 280px; flex-shrink: 0; background: var(--card); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.07); padding: 20px; position: sticky; top: calc(var(--header-h) + 20px); }
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 16px 0; }
        .nav-btn { aspect-ratio: 1; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; background: #eee; color: #555; transition: 0.2s; }
        .nav-btn.answered { background: var(--answered); color: #fff; }
        .nav-btn.review { background: var(--review); color: #fff; }
        .nav-btn.current { outline: 3px solid var(--primary); outline-offset: 2px; }

        main { flex: 1; min-width: 0; }
        .test-card { background: var(--card); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.07); padding: 32px; animation: fadeUp 0.4s ease both; }
        .question-area { border: 1.5px solid var(--border); border-radius: 12px; padding: 25px; background: #f8fbff; margin-top: 20px; }
        
        .option { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; transition: 0.2s; background: #fff; margin-bottom: 10px; }
        .option:hover { border-color: var(--primary); background: #edfaf7; }
        .option.selected { border-color: var(--accent); background: #f0eeff; }
        .option input { display: none; }

        .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
        .btn { padding: 11px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .btn-prev { background: var(--border); }
        .btn-next { background: var(--primary); color: #fff; }
        .btn-submit { background: #e0384a; color: #fff; display: none; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 820px) { .layout { flex-direction: column; } .sidebar { width: 100%; } }
    </style>
</head>
<body>

<header>
    <h1>T.G.P.C.E.T Online Examination</h1>
    <div class="subtitle">{{ test.title }} | Student: {{ request.user.username|upper }}</div>
    <div class="timer-badge">
        <span class="dot"></span>
        <span id="timerDisplay">00:00</span>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <h2>Question Navigator</h2>
        <div class="nav-grid" id="navGrid"></div>
        <div class="stats-row" style="display: flex; justify-content: space-around; font-size: 0.8rem; border-top: 1px solid #eee; padding-top: 10px;">
            <div class="stat"><strong id="statAnswered">0</strong><br>Done</div>
            <div class="stat"><strong id="statReview">0</strong><br>Review</div>
            <div class="stat"><strong id="statNot">0</strong><br>Left</div>
        </div>
    </aside>

    <main>
        <form id="testForm" action="{% url 'test_submit' test.id %}" method="POST">
            {% csrf_token %}
            <div class="test-card">
                <div class="test-title" style="text-align: center; font-weight: bold; font-size: 1.2rem;">{{ test.title }}</div>
                
                <div id="questionContainer">
                    </div>

                <div class="actions">
                    <button type="button" class="btn btn-prev" onclick="navigate(-1)">← Previous</button>
                    <button type="button" class="btn btn-review" onclick="markReview()" style="background: var(--review); color:white;">Review</button>
                    <button type="button" class="btn btn-next" id="nextBtn" onclick="navigate(1)">Next →</button>
                    <button type="submit" class="btn btn-submit" id="submitBtn">Submit Test</button>
                </div>
            </div>
        </form>
    </main>
</div>

{{ questions_json|json_script:"questions-data" }}

<script>
    // 1. Load Data
    const rawData = JSON.parse(document.getElementById('questions-data').textContent);
    // Convert backend list to usable array
    const questions = [];
    {% for q in questions %}
    questions.push({
        id: "{{ q.id }}",
        text: "{{ q.question_text|escapejs }}",
        options: {
            "A": "{{ q.option_a|escapejs }}",
            "B": "{{ q.option_b|escapejs }}",
            "C": "{{ q.option_c|escapejs }}",
            "D": "{{ q.option_d|escapejs }}"
        }
    });
    {% endfor %}

    let current = 0;
    let responses = {}; // Stores { question_id: selected_value }
    let reviewed = new Set();
    let totalSeconds = {{ test.duration }} * 60;

    // 2. Timer Logic
    const timerInterval = setInterval(() => {
        totalSeconds--;
    
        if (totalSeconds < 0) {
            clearInterval(timerInterval);
            document.getElementById('timerDisplay').textContent = "00:00";
            document.getElementById('testForm').submit();
            return;
        }
    
        const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');
        timerDisplay.textContent = `${m}:${s}`;
    }, 1000);

    // 3. Navigation Grid
    const navGrid = document.getElementById('navGrid');
    function buildNav() {
        navGrid.innerHTML = '';
        questions.forEach((_, i) => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.textContent = i + 1;
            btn.onclick = () => { current = i; render(); };
            navGrid.appendChild(btn);
        });
    }

    function updateNav() {
        const btns = navGrid.querySelectorAll('.nav-btn');
        btns.forEach((btn, i) => {
            btn.className = 'nav-btn';
            const qId = questions[i].id;
            if (i === current) btn.classList.add('current');
            if (reviewed.has(i)) btn.classList.add('review');
            else if (responses[qId]) btn.classList.add('answered');
        });

        // Stats
        const answeredCount = Object.keys(responses).length;
        document.getElementById('statAnswered').textContent = answeredCount;
        document.getElementById('statReview').textContent = reviewed.size;
        document.getElementById('statNot').textContent = questions.length - answeredCount;
    }

    // 4. Render Question
    const qContainer = document.getElementById('questionContainer');
    function render() {
        const q = questions[current];
        const selected = responses[q.id] || null;

        let optionsHtml = '';
        for (const [key, val] of Object.entries(q.options)) {
            optionsHtml += `
                <label class="option ${selected === key ? 'selected' : ''}">
                    <input type="radio" name="${q.id}" value="${key}" 
                           ${selected === key ? 'checked' : ''} 
                           onchange="selectOption('${q.id}', '${key}')">
                    <span style="font-weight:bold; margin-right:10px;">${key}.</span> ${val}
                </label>
            `;
        }

        qContainer.innerHTML = `
            <div class="question-area">
                <div style="margin-bottom:15px;">
                    <span style="background:var(--primary); color:#fff; padding:2px 8px; border-radius:4px; font-size:0.8rem; margin-right:10px;">Q${current + 1}</span>
                    <span style="font-weight:600; line-height:1.5;">${q.text}</span>
                </div>
                <div class="options">${optionsHtml}</div>
            </div>
        `;

        // Buttons Visibility
        document.getElementById('nextBtn').style.display = (current === questions.length - 1) ? 'none' : 'block';
        document.getElementById('submitBtn').style.display = (current === questions.length - 1) ? 'block' : 'none';
        
        updateNav();
    }

    window.selectOption = function(qId, val) {
        responses[qId] = val;
        render();
    };

    window.navigate = function(dir) {
        let next = current + dir;
        if (next >= 0 && next < questions.length) {
            current = next;
            render();
        }
    };

    window.markReview = function() {
        if (reviewed.has(current)) reviewed.delete(current);
        else reviewed.add(current);
        updateNav();
    };

    // Init
    buildNav();
    render();
</script>
</body>
</html>
