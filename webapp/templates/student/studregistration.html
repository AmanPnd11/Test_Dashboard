{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Sign In | Aman Technologies</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
       body {
    min-height: 100vh;
    /* background: linear-gradient(135deg, #1e3c72, #2a5298); */
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", sans-serif;
    padding: 20px;

    background-image: url("{% static 'images/tgp_logo1.jpg' %}");
    background-color: rgba(0,0,0,0.5);  
    background-size: cover;
    background-position: center;
    background-blend-mode: darken;
    background-attachment: fixed; 

}

/* ================= CARD ================= */
.login-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 35px 30px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    animation: fadeIn 0.8s ease;
}

/* ================= BRAND ================= */
.brand1 {
    font-size: 20px;
    font-weight: 600;
    color: #2a5298;
    text-align: center;
    margin-bottom: 5px;
}

.brand {
    font-size: 24px;
    font-weight: 700;
    color: #1e3c72;
    text-align: center;
    margin-bottom: 25px;
}

/* ================= FORM ================= */
.form-label {
    font-size: 14px;
    margin-bottom: 6px;
    color: #333;
}

.form-control {
    border-radius: 12px;
    padding: 12px 14px;
    border: 1px solid #dcdcdc;
    transition: all 0.3s ease;
    font-size: 14px;
}

.form-control:focus {
    border-color: #2a5298;
    box-shadow: 0 0 0 3px rgba(42,82,152,0.15);
}

/* Select fix */
select.form-control {
    appearance: none;
}

/* ================= BUTTON ================= */
.btn-primary {
    background: linear-gradient(45deg, #1e3c72, #2a5298);
    border: none;
    border-radius: 14px;
    padding: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* ================= LINKS ================= */
.extra-links p {
    font-size: 14px;
    margin-bottom: 8px;
}

.extra-links a {
    color: #2a5298;
    text-decoration: none;
    font-weight: 600;
}

.extra-links a:hover {
    text-decoration: underline;
}

/* ================= ERROR ================= */
.error-text {
    color: #dc3545;
    font-size: 13px;
}

/* ================= ANIMATION ================= */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ================= RESPONSIVE ================= */
@media (max-width: 576px) {
    .login-card {
        padding: 25px 20px;
    }

    .brand {
        font-size: 20px;
    }

    .brand1 {
        font-size: 16px;
    }
}
    </style>
</head>
<body>

<div class="login-card">

    <div class="brand1"><img src="{% static 'images/tgpcete.jpg' %}" class="img-fluid hero-img" width="200"></div>

    <div class="brand">🔒 Students Registration </div>
    

    <form method="post" action="{% url 'studregistration' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label"><b>Full Name</b></label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="mb-3">
            <label class="form-label"><b>Email</b></label>
            <input type="Email" name="mail" class="form-control" placeholder="Enter your Email" required>
        </div>

        <div class="mb-3">
            <label class="form-label"><b>Roll No.</b></label>
            <input type="text" name="RollNo" class="form-control" placeholder="Enter your Roll No." required>
        </div>
        
        <div class="mb-3">
            <label class="form-label"><b>Department</b></label>
            <select name="Department" class="form-control" required>
                <option value="">-- Select Department --</option>
                {% for dept in departments %}
                    <option value="{{ dept.id }}">
                        {{ dept.Deptcode }}
                    </option>
                {% endfor %}
            </select>
        </div>
        

        <div class="mb-3">
            <label class="form-label"><b>Mobile No.</b></label>
            <input type="text" name="MobileNo" class="form-control" placeholder="Enter your Mobile No." required>
        </div>


        <div class="mb-3">
            <label class="form-label"><b>Create Password</b></label>
            <input type="password" name="CreatePassword" class="form-control" placeholder="Enter your New password" required>
        </div>


        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">Sign In</button>
        </div>

        <div class="extra-links text-center mt-4">
            <p>
                Already have an accounts? <a href="{% url 'studentlogin'%}">Login</a>
            </p>
        </div>

        <div class="extra-links text-center mt-4">
            <p>
                <!-- <a href="{% url 'studentdashboard'%}">Back!</a> -->
                <a href="{% url 'base'%}">Back!</a> 

            </p>
        </div>
    </form>

    
</div>

</body>
</html>
