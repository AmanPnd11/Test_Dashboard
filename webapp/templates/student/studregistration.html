<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Sign In | Aman Technologies</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #6f74dd,rgb(90, 29, 204));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            margin-top: 40px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            color: #6f74dd;
            text-align: center;
            margin-bottom: 10px;
        }

        .brand1 {
            font-size: 28px;
            font-weight: 700;
            color: #6f74dd;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-primary {
            background: #6f74dd;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #5c60c9;
        }

        .extra-links a {
            color: #6f74dd;
            text-decoration: none;
            font-weight: 500;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .error-text {
            color: #dc3545;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class="brand1">Aman Technologies</div>

    <div class="brand">🔒 Students Registration </div>
    

    <form method="post" action="{% url 'studregistration' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label"><b>Username</b></label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="mb-3">
            <label class="form-label"><b>Email</b></label>
            <input type="Email" name="mail" class="form-control" placeholder="Enter your Email" required>
        </div>

        <div class="mb-3">
            <label class="form-label"><b>Roll No.</b></label>
            <input type="text" name="RollNo" class="form-control" placeholder="Enter your Roll No." required>
        </div>
        
        <div class="mb-3">
            <label class="form-label"><b>Department</b></label>
            <select name="Department" class="form-control" required>
                <option value="">-- Select Department --</option>
                {% for dept in departments %}
                    <option value="{{ dept.id }}">
                        {{ dept.Deptcode }}
                    </option>
                {% endfor %}
            </select>
        </div>
        

        <div class="mb-3">
            <label class="form-label"><b>Mobile No.</b></label>
            <input type="text" name="MobileNo" class="form-control" placeholder="Enter your Mobile No." required>
        </div>


        <div class="mb-3">
            <label class="form-label"><b>Create Password</b></label>
            <input type="password" name="CreatePassword" class="form-control" placeholder="Enter your New password" required>
        </div>


        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">Sign In</button>
        </div>

        <div class="extra-links text-center mt-4">
            <p>
                Already have an accounts? <a href="{% url 'studentlogin'%}">Login</a>
            </p>
        </div>

        <div class="extra-links text-center mt-4">
            <p>
                <a href="{% url 'studentdashboard'%}">Back!</a>
            </p>
        </div>
    </form>

    
</div>

</body>
</html>
