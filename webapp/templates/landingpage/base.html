{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Django Landing</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    font-family:'Montserrat',sans-serif;
}

/* ================= HERO BACKGROUND ================= */
.hero{
    height:100vh;
    background:
    linear-gradient(120deg,
    rgba(10,10,40,0.85),
    rgba(0,140,255,0.65)),
    url("{% static 'images/bg.jpg' %}");
    background-size:cover;
    background-position:center;
}

/* ================= GLASS NAVBAR ================= */
.navbar{
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    box-shadow:0 4px 30px rgba(0,0,0,0.2);
}

.navbar-brand{
    color:white !important;
    font-weight:700;
    font-size:26px;
}

.nav-link{
    color:white !important;
    margin-right:18px;
    position:relative;
}

/* underline animation */
.nav-link::after{
    content:'';
    width:0%;
    height:2px;
    background:#00d4ff;
    position:absolute;
    bottom:-5px;
    left:0;
    transition:0.4s;
}

.nav-link:hover::after{
    width:100%;
}

/* ================= HERO CONTENT ================= */
.hero-content{
    height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero-content h1{
    font-size:65px;
    font-weight:700;
    animation:fadeUp 1.2s ease;
}

.hero-content span{
    color:#00d4ff;
}

.hero-content p{
    font-size:20px;
    margin-top:15px;
    animation:fadeUp 1.6s ease;
}

/* buttons */
.btn-main{
    padding:14px 35px;
    border-radius:50px;
    font-weight:600;
    background:linear-gradient(45deg,#00d4ff,#0066ff);
    border:none;
    color:white;
    margin-top:25px;
    transition:.4s;
}

.btn-main:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* animation */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* floating effect */
.hero-img{
    margin-top:30px;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-15px);}
    100%{transform:translateY(0px);}
}



</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg fixed-top">
<div class="container">

<a class="navbar-brand" href="{% url 'base'%}">
<i class="fa-solid fa-rocket"></i> 
</a>

<button class="navbar-toggler bg-light"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navmenu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navmenu">
<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="{% url 'studregistration' %}">Register</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">About</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Contact</a>
</li>

<li class="nav-item ms-3">
<a class="btn btn-main" href="{% url 'studentlogin' %}">
Login
</a>
</li>

</ul>
</div>
</div>
</nav>

<!-- ================= HERO SECTION ================= -->
 
<section class="hero">

<div class="hero-content container">
    

<h1>
    Integrated Digital Examination & Assessment Portal
</h1>

<p>
Modern Examination Panels • online Assessment Systems • Secure Systems
</p>

<a href="#" class="btn btn-main">
Get Started <i class="fa-solid fa-arrow-right"></i>
</a>

<img src="{% static 'images/exam1.jpg' %}"
class="img-fluid hero-img"
width="150">

</div>

</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
