{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Django Landing</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
}

/* ================= HERO BACKGROUND ================= */
.hero{
    min-height:100vh;
    background:
    linear-gradient(120deg,
    rgba(10,10,40,0.90),
    rgba(0,140,255,0.75)),
    url("{% static 'images/bg.jpg' %}");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
}

/* ================= NAVBAR ================= */
.navbar{
    backdrop-filter: blur(14px);
    background: rgba(255,255,255,0.07);
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
    padding:15px 0;
}

.navbar-brand{
    color:white !important;
    font-weight:700;
    font-size:24px;
}

.nav-link{
    color:white !important;
    margin-right:20px;
    position:relative;
    font-weight:500;
}

.nav-link::after{
    content:'';
    width:0%;
    height:2px;
    background:#00d4ff;
    position:absolute;
    bottom:-5px;
    left:0;
    transition:0.4s;
}

.nav-link:hover::after{
    width:100%;
}

/* ================= HERO CONTENT ================= */
.hero-content{
    color:white;
}

.hero-content h1{
    font-size:52px;
    font-weight:700;
    line-height:1.3;
    animation:fadeUp 1s ease;
}

.hero-content p{
    font-size:18px;
    margin-top:15px;
    opacity:0.9;
    animation:fadeUp 1.4s ease;
}

.btn-main{
    padding:13px 32px;
    border-radius:50px;
    font-weight:600;
    background:linear-gradient(45deg,#00d4ff,#0066ff);
    border:none;
    color:white;
    margin-top:25px;
    transition:.4s;
}

.btn-main:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(0,0,0,0.4);
}

/* ================= IMAGE ================= */
.hero-img{
    max-width:100%;
    animation:float 4s ease-in-out infinite;
}

/* ================= ANIMATIONS ================= */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-15px);}
    100%{transform:translateY(0px);}
}

/* ================= RESPONSIVE ================= */
@media(max-width:992px){

.hero{
    text-align:center;
}

.hero-content h1{
    font-size:38px;
}

.hero-content p{
    font-size:16px;
}

}

@media(max-width:576px){

.hero-content h1{
    font-size:30px;
}

.btn-main{
    padding:10px 25px;
}

}

</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg fixed-top">
<div class="container">

<a class="navbar-brand" href="{% url 'base'%}">
    <img src="{% static 'images/tgpcete.jpg' %}"
class="img-fluid hero-img"
width="200">
{% comment %} <i class="fa-solid fa-rocket"></i> {% endcomment %}
</a>

<button class="navbar-toggler bg-light"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navmenu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navmenu">
<ul class="navbar-nav ms-auto align-items-lg-center">

<li class="nav-item">
<a class="nav-link" href="{% url 'studregistration' %}">Register</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">About</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Contact</a>
</li>

<li class="nav-item ms-lg-3 mt-3 mt-lg-0">
<a class="btn btn-main" href="{% url 'studentlogin' %}">
Login
</a>
</li>

</ul>
</div>
</div>
</nav>

<!-- ================= HERO SECTION ================= -->
<section class="hero">

<div class="container">
<div class="row align-items-center">

<!-- LEFT SIDE -->
<div class="col-lg-6 hero-content">
<h1>
Integrated Digital Examination & Assessment Portal
</h1>

<p>
Modern Examination Panels • Online Assessment Systems • Secure & Reliable Platform
</p>

<a href="#" class="btn btn-main">
Get Started <i class="fa-solid fa-arrow-right ms-2"></i>
</a>
</div>

<!-- RIGHT SIDE -->
<div class="col-lg-6 text-center mt-5 mt-lg-0">
<img src="{% static 'images/exam1.jpg' %}"
class="img-fluid hero-img"
width="400">
</div>

</div>
</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
